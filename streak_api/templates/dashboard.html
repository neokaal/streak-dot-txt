<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Streak.txt</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <p class="eyebrow">STREAK.TXT</p>
        <h1>Today</h1>
      </div>
      <p class="header-summary"><strong>{{ streaks|length }}</strong> streak{% if streaks|length != 1 %}s{% endif %}</p>
    </header>

    <details class="create-streak">
      <summary>+ New streak</summary>
      <form method="post" action="/ui/streaks">
        <label>Name <input required name="name" placeholder="Morning walk"></label>
        <label>Cadence <select name="tick_type"><option>Daily</option><option>Weekly</option></select></label>
        <label>Description <input name="description" placeholder="Optional"></label>
        <button>Create</button>
      </form>
    </details>

    <section aria-labelledby="streaks-heading">
      <div class="section-heading"><h2 id="streaks-heading">Your streaks</h2><span>Use + Tick to record today</span></div>
      <div class="cards">
        {% for streak_id, streak in streaks %}{% include "partials/streak_card.html" %}{% else %}
          <p class="empty">No streaks yet. Start with one small practice.</p>
        {% endfor %}
      </div>
    </section>
  </main>
</body>
</html>
