name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements*.txt

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify the tag matches the application version
        if: github.event_name == 'push'
        run: |
          python -c "import os; from streak_core.version import __version__; expected = f'v{__version__}'; actual = os.environ['GITHUB_REF_NAME']; assert actual == expected, f'tag {actual} does not match version {expected}'"

      - name: Install locked dependencies
        run: |
          python -m venv .env
          make install

      - name: Run the complete checks
        run: make check

  build:
    name: Build ${{ matrix.label }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            artifact: macos-arm64
            os: macos-15
            architecture: arm64
            bundle: dmg
            artifactPath: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows x64
            artifact: windows-x64
            os: windows-latest
            architecture: AMD64
            bundle: nsis
            artifactPath: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.txt
            requirements.txt

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Confirm the native runner architecture
        shell: bash
        run: |
          python -c "import platform; expected = '${{ matrix.architecture }}'; actual = platform.machine(); assert actual == expected, f'runner architecture {actual} does not match {expected}'"

      - name: Install locked build dependencies
        run: python -m pip install --constraint requirements.lock --requirement requirements-build.txt

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and stage the native sidecar
        run: python desktop/package_release.py --prepare-sidecar

      - name: Build the installer
        working-directory: desktop
        env:
          CI: "true"
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}

      - name: Store the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: streak-txt-${{ matrix.artifact }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the verified installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Streak.txt $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for the changes in this release."
