[package]
name = "streak-txt"
version = "0.1.1"
description = "Local-first desktop streak tracker"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
