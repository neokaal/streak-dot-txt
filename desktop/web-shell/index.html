<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streak.txt</title>
<style>body{font:16px system-ui,sans-serif;color:#1e2922;background:#f5f3eb;margin:0;padding:28px}p{color:#657069;max-width:42rem}.error{color:#8b2f2f;white-space:pre-wrap}</style>
<h1>Starting Streak.txt…</h1>
<p id="status">Preparing your local streaks. The first launch after installation can take a little longer.</p>
<script>
  window.__streakStartupFailed = function (message) {
    const status = document.getElementById("status");
    status.className = "error";
    status.textContent = message;
  };
</script>
</html>
